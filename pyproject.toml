[project]
name = "vre"
version = "0.8.0"
description = "Volute Reasoning Engine — decorator-based epistemic enforcement"
authors = [
    {name = "Andrew Greene",email = "anormang@gmail.com"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "pydantic>=2.0",
    "spacy>=3.8",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.0,<7.0"]
examples = [
    "neo4j>=5.0,<7.0",
    "rich>=14.3.2",
    "langchain-core>=1.2.16",
    "langchain-ollama>=1.0.1",
    "questionary (>=2.1.1,<3.0.0)"
]

[tool.poetry]
packages = [{include = "vre", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = ["pytest>=9.0.2,<10.0.0", "pytest-cov (>=7.0.0,<8.0.0)", "ruff (>=0.15.5,<0.16.0)"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
addopts = "--cov=src/vre --cov-fail-under=70"
